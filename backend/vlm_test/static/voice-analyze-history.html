<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Podium · 음성 분석 기록</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 24px;
      color: #111;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .subtitle { color: #666; font-size: 13px; margin: 0; }

    a.btn {
      background: #111;
      color: #fff;
      padding: 9px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 60px 0;
    }

    /* 분석 카드 */
    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 14px;
      background: #fff;
      overflow: hidden;
    }

    .card-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
      background: #fafafa;
    }
    .card-head:hover { background: #f0f4f9; }

    .card-title { font-weight: 600; font-size: 15px; flex: 1; }
    .card-meta { font-size: 12px; color: #666; }

    .chev { transition: transform 0.15s; font-size: 12px; }
    .card.open .chev { transform: rotate(90deg); }

    .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      background: #eee;
    }
    .pill.blue  { background: #e3f2fd; color: #1565c0; }
    .pill.green { background: #e8f5e9; color: #2e7d32; }

    /* 카드 상세 내용 */
    .card-body {
      display: none;
      padding: 20px;
      border-top: 1px solid #eee;
    }
    .card.open .card-body { display: block; }

    /* 요약 카드 그리드 */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .summary-card {
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .summary-card .label { font-size: 12px; color: #888; margin-bottom: 4px; }
    .summary-card .value { font-size: 24px; font-weight: 700; }

    /* 스크립트 박스 */
    .transcript-box {
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      margin-bottom: 16px;
      max-height: 200px;
      overflow-y: auto;
    }

    /* 필러단어 테이블 */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-bottom: 16px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 7px 10px;
      text-align: left;
    }
    th { background: #f5f5f5; font-weight: 600; }

    /* 무음 구간 리스트 */
    .silence-list { list-style: none; padding: 0; margin: 0 0 16px; }
    .silence-list li {
      background: #f5f5f5;
      border-radius: 6px;
      padding: 7px 12px;
      margin-bottom: 6px;
      font-size: 13px;
    }

    /* 개선 포인트 */
    .notes-box {
      background: #fff8e1;
      border-left: 4px solid #f9a825;
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    /* 섹션 제목 */
    h3 { font-size: 15px; margin: 20px 0 10px; border-bottom: 1px solid #eee; padding-bottom: 6px; }

    /* JSON 보기 */
    details summary { cursor: pointer; font-weight: 600; margin: 10px 0 6px; font-size: 13px; }
    pre.json {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      max-height: 300px;
      overflow: auto;
      white-space: pre;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div>
      <h1>음성 분석 기록</h1>
      <p class="subtitle">완료된 음성 분석 목록입니다. 카드를 클릭하면 결과를 볼 수 있습니다.</p>
    </div>
    <a href="/voice-analyze" class="btn">+ 새 분석</a>
  </div>

  <div id="list">
    <div class="empty">불러오는 중...</div>
  </div>

<script>
  // 날짜 포맷 함수
  function formatTime(iso) {
    return iso ? iso.replace("T", " ") : "-";
  }

  // 파일 크기 포맷 함수
  function formatSize(bytes) {
    return (bytes / 1024 / 1024).toFixed(1) + " MB";
  }

  // HTML 특수문자 이스케이프 (XSS 방지)
  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // 목록 불러오기
  async function loadList() {
    const res = await fetch("/api/voice-history");
    const items = await res.json();
    const listEl = document.getElementById("list");

    if (items.length === 0) {
      listEl.innerHTML = '<div class="empty">분석 기록이 없습니다. <a href="/voice-analyze">새 분석 시작</a></div>';
      return;
    }

    listEl.innerHTML = "";
    items.forEach(function(item) {
      listEl.appendChild(makeCard(item));
    });
  }

  // 카드 요소 만들기
  function makeCard(item) {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="card-head">
        <span class="chev">▶</span>
        <div class="card-title">${escapeHtml(item.original_name)}</div>
        <span class="card-meta">${formatTime(item.uploaded_at)}</span>
        <span class="pill">${formatSize(item.size_bytes)}</span>
        <span class="pill blue">${item.speech_rate_wpm ?? "-"} 단어/분</span>
        <span class="pill green">필러 ${item.filler_total ?? "-"}번</span>
      </div>
      <div class="card-body"></div>
    `;

    card.querySelector(".card-head").addEventListener("click", function() {
      toggleCard(card, item);
    });

    return card;
  }

  // 카드 열기/닫기
  async function toggleCard(card, item) {
    const body = card.querySelector(".card-body");

    // 이미 열려 있으면 닫기
    if (card.classList.contains("open")) {
      card.classList.remove("open");
      return;
    }

    card.classList.add("open");

    // 이미 로드됐으면 다시 로드 안 함
    if (body.dataset.loaded === "1") return;

    body.innerHTML = '<div class="empty">로드 중...</div>';

    try {
      const res = await fetch(`/api/voice-history/${item.job_id}`);
      const data = await res.json();
      body.innerHTML = makeDetail(data.result);
      body.dataset.loaded = "1";
    } catch (e) {
      body.innerHTML = `<div class="empty">로드 실패: ${e.message}</div>`;
    }
  }

  // 상세 내용 HTML 만들기
  function makeDetail(result) {
    // 요약 카드
    const summaryHtml = `
      <div class="summary-grid">
        <div class="summary-card">
          <div class="label">말 속도</div>
          <div class="value">${result.speech_rate_wpm ?? "-"}</div>
          <div class="label">단어/분</div>
        </div>
        <div class="summary-card">
          <div class="label">총 무음 시간</div>
          <div class="value">${result.total_silence_sec?.toFixed(1) ?? "-"}</div>
          <div class="label">초</div>
        </div>
        <div class="summary-card">
          <div class="label">필러단어 횟수</div>
          <div class="value">${result.filler_total ?? "-"}</div>
          <div class="label">번</div>
        </div>
      </div>
    `;

    // 스크립트
    const transcriptHtml = `
      <h3>발화 스크립트</h3>
      <div class="transcript-box">${escapeHtml(result.transcript || "(내용 없음)")}</div>
    `;

    // 필러단어 테이블
    const fillers = result.filler_words || [];
    let fillerRows = "";
    if (fillers.length === 0) {
      fillerRows = '<tr><td colspan="3">필러단어 없음</td></tr>';
    } else {
      fillers.forEach(function(f) {
        fillerRows += `
          <tr>
            <td><strong>${escapeHtml(f.word)}</strong></td>
            <td>${f.count}번</td>
            <td>${escapeHtml((f.timestamps || []).join(", ") || "-")}</td>
          </tr>
        `;
      });
    }
    const fillerHtml = `
      <h3>필러단어</h3>
      <table>
        <thead><tr><th>단어</th><th>횟수</th><th>등장 시각</th></tr></thead>
        <tbody>${fillerRows}</tbody>
      </table>
    `;

    // 무음 구간
    const intervals = result.silence_intervals || [];
    let silenceItems = "";
    if (intervals.length === 0) {
      silenceItems = "<li>무음 구간 없음</li>";
    } else {
      intervals.forEach(function(s, i) {
        silenceItems += `<li>구간 ${i + 1}: ${s.start_sec?.toFixed(1)}초 ~ ${s.end_sec?.toFixed(1)}초 (${s.duration_sec?.toFixed(1)}초간)</li>`;
      });
    }
    const silenceHtml = `
      <h3>무음 구간</h3>
      <ul class="silence-list">${silenceItems}</ul>
    `;

    // 개선 포인트
    const notesHtml = `
      <h3>개선 포인트</h3>
      <div class="notes-box">${escapeHtml(result.notes || "특이사항 없음")}</div>
    `;

    // 원본 JSON
    const jsonHtml = `
      <details>
        <summary>원본 JSON 보기</summary>
        <pre class="json">${escapeHtml(JSON.stringify(result, null, 2))}</pre>
      </details>
    `;

    return summaryHtml + transcriptHtml + fillerHtml + silenceHtml + notesHtml + jsonHtml;
  }

  // 페이지 로드 시 목록 불러오기
  loadList();
</script>

</body>
</html>
